<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ultimate Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #edf3f6;
    color: #19384f;
    padding: 25px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
}

h1 {
    margin-top: 0;
}

fieldset {
    border: none;
    margin: 25px 0;
    padding: 0;
}

legend {
    color: #087b7d;
    font-weight: bold;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 14px;
}

label {
    display: block;
    margin-bottom: 6px;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="color"]):not([type="range"]),
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #aabac6;
    border-radius: 3px;
}

.inline label {
    display: inline-block;
    margin-right: 10px;
}

input[type="range"] {
    width: 100%;
    accent-color: #167477;
}

input[type="color"] {
    width: 50px;
    height: 35px;
}

button {
    background: #167477;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #10595b;
}

@media(max-width: 500px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Application Form</h1>
<p>Student internship application. * Required</p>

<form>

<fieldset>
<legend>Personal Details</legend>

<div class="form-group">
<label for="name">Full name *</label>
<input type="text" id="name" value="Ammar Anees" required>
</div>

<div class="form-group">
<label for="email">Email *</label>
<input type="email" id="email" value="rehmanhilal483@gmail.com" required>
</div>

<div class="form-group">
<label for="password">Password *</label>
<input type="password" id="password" required minlength="8">
</div>

<div class="form-group">
<label for="phone">Phone *</label>
<input type="tel" id="phone" pattern="[0-9]{10}" placeholder="9520564348" required>
</div>

<div class="form-group">
<label for="portfolio">Portfolio URL</label>
<input type="url" id="portfolio" placeholder="https://example.com">
</div>

<div class="form-group">
<label for="age">Age *</label>
<input type="number" id="age" value="20" min="18" required>
</div>

<div class="form-group inline">
<label>Gender:</label>
<label><input type="radio" name="gender" checked> Male</label>
<label><input type="radio" name="gender"> Female</label>
<label><input type="radio" name="gender"> Other / prefer not to say</label>
</div>

</fieldset>

<fieldset>
<legend>Education</legend>

<div class="form-group">
<label for="course">Course *</label>
<select id="course" required>
<option selected>BTech — Computer Science</option>
<option>BCA</option>
<option>MCA</option>
<option>BBA</option>
</select>
</div>

<div class="form-group">
<label for="city">Preferred city (datalist)</label>
<input list="cities" id="city" placeholder="Delhi">
<datalist id="cities">
<option value="Delhi">
<option value="Bareilly">
<option value="Lucknow">
<option value="Noida">
</datalist>
</div>

<div class="form-group inline">
<label>Skills:</label>
<label><input type="checkbox" checked> HTML</label>
<label><input type="checkbox" checked> CSS</label>
<label><input type="checkbox"> JavaScript</label>
</div>

</fieldset>

<fieldset>
<legend>Upload & Extras</legend>

<div class="form-group">
<label for="date">Available from</label>
<input type="date" id="date" value="2026-11-15">
</div>

<div class="form-group">
<label for="time">Interview time</label>
<input type="time" id="time" value="10:30">
</div>

<div class="form-group">
<label for="resume">Resume *</label>
<input type="file" id="resume" accept=".pdf,.doc,.docx" required>
</div>

<div class="form-group">
<label for="stipend">
Expected monthly stipend: ₹<output id="amount">10000</output>
</label>
<input type="range" id="stipend" min="5000" max="20000" value="10000"
oninput="document.getElementById('amount').value=this.value">
</div>

<div class="form-group">
<label for="colour">Favourite colour</label>
<input type="color" id="colour" value="#167477">
</div>

<div class="form-group">
<label for="reason">Why would you like to join?</label>
<textarea id="reason" rows="4">I want to practise HTML and CSS on real projects.</textarea>
</div>

</fieldset>

<button type="submit">Submit application</button>
<button type="reset">Reset</button>

</form>
</div>

</body>
</html>
